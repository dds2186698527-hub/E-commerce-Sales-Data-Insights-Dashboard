<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>电商销售数据洞察看板</title>
    <!-- 引入 ECharts，如果没网可以把文件下载到本地 -->
    <script src="js/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; }
        
        /* F1 KPI卡片：横向排列 */
        .kpi-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .kpi-card { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .kpi-card h3 { font-size: 16px; color: #666; margin-bottom: 10px; }
        .kpi-card p { font-size: 24px; font-weight: bold; color: #333; }

        /* F2/F3 筛选区 */
        .filter-container { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        .filter-container select, .filter-container input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .filter-container button { padding: 8px 20px; background: #5470c6; color: #fff; border: none; border-radius: 4px; cursor: pointer; }

        /* F4-F7 图表区：网格布局 */
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-box { background: #fff; padding: 15px; border-radius: 8px; height: 350px; }

        /* F8 表格 */
        .table-container { background: #fff; padding: 15px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; }
        th { background: #fafafa; }
        .pagination { display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
    </style>
</head>
<body>

    <!-- F1 KPI -->
    <div class="kpi-container">
        <div class="kpi-card"><h3>总销售额</h3><p id="kpi-sales">--</p></div>
        <div class="kpi-card"><h3>总订单数</h3><p id="kpi-orders">--</p></div>
        <div class="kpi-card"><h3>平均客单价</h3><p id="kpi-avg">--</p></div>
        <div class="kpi-card"><h3>热销商品数</h3><p id="kpi-hot">--</p></div>
    </div>

    <!-- F2/F3 筛选 -->
    <div class="filter-container">
        <select id="category-select">
            <option value="">全部品类</option>
            <option value="手机">手机</option>
            <option value="电脑">电脑</option>
        </select>
        <input type="date" id="start-date"> 至 <input type="date" id="end-date">
        <button>查询</button>
    </div>

    <!-- F4-F7 图表占位 -->
    <div class="charts-grid">
        <div id="chart-line" class="chart-box"></div>  <!-- F4 折线图 -->
        <div id="chart-bar" class="chart-box"></div>   <!-- F5 柱状图 -->
        <div id="chart-top10" class="chart-box"></div> <!-- F6 横向柱状图 -->
        <div id="chart-pie" class="chart-box"></div>   <!-- F7 饼图 -->
    </div>

    <!-- F8 表格 -->
    <div class="table-container">
        <table>
            <thead><tr><th>订单号</th><th>商品名</th><th>金额</th><th>日期</th></tr></thead>
            <tbody>
                <tr><td>1</td><td>iPhone 15</td><td>6999</td><td>2026-10-01</td></tr>
                <tr><td>2</td><td>华为Mate60</td><td>5999</td><td>2026-10-02</td></tr>
            </tbody>
        </table>
        <div class="pagination">
            <button>上一页</button> <span>第 1 页</span> <button>下一页</button>
        </div>
    </div>

    <script>
        document.getElementById('kpi-sales').innerText = '¥ 500,000';
        document.getElementById('kpi-orders').innerText = '1,200';
        document.getElementById('kpi-avg').innerText = '¥ 416';
        document.getElementById('kpi-hot').innerText = '15';

        // F4 折线图
        echarts.init(document.getElementById('chart-line')).setOption({
            grid: { left: '60px', right: '30px', top: '60px', bottom: '40px' },
            title: { text: 'F4 销售趋势', left: 'center' },
            xAxis: { type: 'category', data: ['10-01', '10-02', '10-03'] },
            yAxis: { type: 'value' },
            series: [{ type: 'line', data: [20000, 30000, 25000], smooth: true }]
        });

        // F5 柱状图
        echarts.init(document.getElementById('chart-bar')).setOption({
            title: { text: 'F5 品类销售', left: 'center' },
            xAxis: { type: 'category', data: ['手机', '电脑', '服饰'] },
            yAxis: { type: 'value' },
            series: [{ type: 'bar', data: [150000, 120000, 80000] }]
        });

        // F6 TOP10（横向柱状图）
        echarts.init(document.getElementById('chart-top10')).setOption({
            title: { text: 'F6 商品TOP10', left: 'center' },
            xAxis: { type: 'value' },
            yAxis: { type: 'category', data: ['商品C', '商品B', '商品A'] },
            series: [{ type: 'bar', data: [5000, 4200, 3800] }]
        });

        // F7 饼图
        echarts.init(document.getElementById('chart-pie')).setOption({
            title: { text: 'F7 用户占比', left: 'center' },
            series: [{ type: 'pie', radius: '50%', data: [{value: 70, name: '新用户'}, {value: 30, name: '老用户'}] }]
        });
    </script>
</body>
</html>
