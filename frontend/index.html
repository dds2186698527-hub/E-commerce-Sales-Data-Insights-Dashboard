<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>电商销售数据洞察看板</title>
    <!-- ECharts 使用本地文件，离线也能渲染 -->
    <link rel="stylesheet" href="style.css">
    <script src="js/echarts.min.js"></script>
</head>
<body>
    <div class="wrap">

        <!-- 后端不可用 / 接口失败时的提示条 -->
        <div id="status-bar" class="status-bar" hidden>
            <div id="status-text" class="status-text"></div>
            <button id="status-retry" class="status-retry" type="button">重试</button>
        </div>

        <!-- F1 KPI -->
        <section class="kpi-container" aria-label="核心指标">
            <div class="kpi-card">
                <h3>总销售额</h3>
                <p id="kpi-sales">—</p>
            </div>
            <div class="kpi-card">
                <h3>总订单数</h3>
                <p id="kpi-orders">—</p>
            </div>
            <div class="kpi-card">
                <h3>平均客单价</h3>
                <p id="kpi-avg">—</p>
            </div>
            <div class="kpi-card">
                <h3>热销商品数</h3>
                <p id="kpi-hot">—</p>
                <div class="kpi-hint">销量 ≥ 平均单商品销量的商品数</div>
            </div>
        </section>

        <!-- F2 / F3 筛选 -->
        <section class="filter-container">
            <select id="category-select" aria-label="品类">
                <option value="">全部品类</option>
            </select>
            <input type="date" id="start-date" aria-label="开始日期">
            <span>至</span>
            <input type="date" id="end-date" aria-label="结束日期">
            <button id="filter-query" type="button">查询</button>
            <button id="filter-reset" type="button" class="ghost">重置</button>
            <span class="filter-hint">筛选在前端对已加载的订单明细计算（后端暂未提供筛选参数）</span>
        </section>

        <!-- F4 - F7 图表 -->
        <section class="charts-grid">
            <div class="chart-box">
                <div class="chart-title">F4 销售趋势（按日销售额）</div>
                <div id="chart-line" class="chart-canvas"></div>
                <div class="chart-empty" hidden></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">F5 品类销售额</div>
                <div id="chart-bar" class="chart-canvas"></div>
                <div class="chart-empty" hidden></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">F6 商品销量 TOP10</div>
                <div id="chart-top10" class="chart-canvas"></div>
                <div class="chart-empty" hidden></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">F7 品类销售额占比</div>
                <div id="chart-pie" class="chart-canvas"></div>
                <div class="chart-empty" hidden></div>
            </div>
        </section>

        <!-- F8 表格 -->
        <section class="table-container">
            <div class="table-head">
                <h3>F8 订单明细</h3>
                <span id="table-summary" class="table-summary"></span>
            </div>
            <table>
                <thead>
                    <tr><th>订单号</th><th>商品名</th><th>金额</th><th>日期</th></tr>
                </thead>
                <tbody id="order-tbody">
                    <tr class="table-empty"><td colspan="4">加载中…</td></tr>
                </tbody>
            </table>
            <div class="pagination">
                <span id="updated-at" class="updated-at"></span>
                <button id="prev-page" type="button">上一页</button>
                <span id="page-info">第 1 / 1 页</span>
                <button id="next-page" type="button">下一页</button>
            </div>
        </section>

    </div>

    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
